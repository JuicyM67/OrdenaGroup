<!DOCTYPE html>
<html lang="es-CL">
  <body style="font-family: sans-serif; white-space: pre-wrap">
    <p>Haz clic en este link para confirmar tu cuenta y entrar:</p>
    <p>
      <a
        href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup"
        >Confirmar y entrar</a
      >
    </p>
    <p>
      El link vence en 15 minutos. Si no creaste esta cuenta, puedes ignorar
      este correo.
    </p>
    <p>
      No compartas este link con nadie. Nunca te lo vamos a pedir por WhatsApp
      ni por teléfono.
    </p>
  </body>
</html>
