<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Köp presentkort mobil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#F4F4F0}button,input,textarea{font-family:inherit}a{color:#16161A}</style>
</helmet>
<div style="width: 390px; min-height: 1700px; box-sizing: border-box; background: #F4F4F0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #16161A">
  <header style="position: relative; height: 230px; overflow: hidden">
    <img src="/_blob/3d8b5d87b49193b0d757782136e276f3" alt="Salong Norrsken" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(22,22,26,0.35), rgba(22,22,26,0.85))"></div>
    <div style="position: relative; padding: 16px; display: flex; flex-direction: column; gap: 46px; color: #FFFFFF">
      <a href="#" aria-label="Tillbaka" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(255,255,255,0.18); border: 1px solid rgba(255,255,255,0.3); display: flex; align-items: center; justify-content: center; color: #FFFFFF"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></a>
      <div><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #E3F36B">Presentkort</span><h1 style="margin: 6px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.05">Ge bort en stund hos Salong Norrsken</h1></div>
    </div>
  </header>
  <div style="padding: 0 16px 40px; margin-top: -18px; position: relative; display: flex; flex-direction: column; gap: 14px">
    <div style="{{cardStyle}}">
      <div style="display: flex; justify-content: space-between"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 16px; font-weight: 800">Salong Norrsken</span><span style="font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase">Presentkort</span></div>
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 44px; font-weight: 800; letter-spacing: -0.03em; line-height: 1">{{amountLabel}}</span>
    </div>
    <section style="background: #FFFFFF; border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">Belopp</span>
        <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{amounts}}" as="a" hint-placeholder-count="4">
            <button type="button" aria-pressed="{{a.pressed}}" onClick="{{a.pick}}" style="{{a.style}}">{{a.label}}</button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">Design</span>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
          <sc-for list="{{themes}}" as="t" hint-placeholder-count="3">
            <button type="button" aria-label="{{t.label}}" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}"></button>
          </sc-for>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 800">Till vem?</span>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Mottagarens namn<input value="Sara" style="height: 48px; border: 0; background: #F4F4F0; border-radius: 14px; padding: 0 14px; font-size: 15px"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Mottagarens e-post<input value="sara@exempel.se" style="height: 48px; border: 0; background: #F4F4F0; border-radius: 14px; padding: 0 14px; font-size: 15px"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Hälsning<textarea rows="3" style="border: 0; background: #F4F4F0; border-radius: 14px; padding: 12px 14px; font-size: 15px">Grattis på födelsedagen! Kram, Ella</textarea></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Skicka<input value="24 dec 2026, 08:00" style="height: 48px; border: 0; background: #F4F4F0; border-radius: 14px; padding: 0 14px; font-size: 15px"></label>
        <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600">Din e-post (kvitto)<input value="ella@exempel.se" style="height: 48px; border: 0; background: #F4F4F0; border-radius: 14px; padding: 0 14px; font-size: 15px"></label>
      </div>
    </section>
    <button type="button" style="border: 0; background: #C9B8F5; color: #16161A; border-radius: 999px; min-height: 56px; font-size: 16px; font-weight: 700">Betala {{amountLabel}}</button>
    <p style="margin: 0; text-align: center; font-size: 12px; color: #5E5E66">Kort och Apple Pay via Stripe · Ångerrätt i 14 dagar · Gäller i 24 månader</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1700}}'>
class Component extends DCLogic {
  constructor(p){ super(p); this.state = { amt: 1, theme: 1 }; }
  renderVals() {
    const A = [300, 500, 1000, 'Eget'];
    const T = [
      { label: 'Lime', bg: 'background:#E3F36B;color:#16161A' },
      { label: 'Lila', bg: 'background:#C9B8F5;color:#16161A' },
      { label: 'Foto', bg: 'background:linear-gradient(135deg,rgba(22,22,26,.65),rgba(22,22,26,.2)),url(/_blob/0fbf1551077e5e850e73eee8026c68db) center/cover;color:#FFFFFF' }
    ];
    const v = A[this.state.amt];
    return {
      amounts: A.map((a, i) => { const on = this.state.amt === i; return { label: typeof a === 'number' ? a.toLocaleString('sv-SE') + ' kr' : a, pressed: on ? 'true' : 'false', pick: () => this.setState({ amt: i }), style: 'min-height:52px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;' + (on ? 'background:#16161A;color:#FFFFFF;border:2px solid #16161A' : 'background:#FFFFFF;color:#16161A;border:2px solid #E2E2DC') }; }),
      themes: T.map((t, i) => { const on = this.state.theme === i; return { label: t.label, pressed: on ? 'true' : 'false', pick: () => this.setState({ theme: i }), style: 'height:64px;border-radius:14px;cursor:pointer;' + t.bg + ';' + (on ? 'border:3px solid #16161A' : 'border:3px solid transparent') }; }),
      amountLabel: typeof v === 'number' ? v.toLocaleString('sv-SE') + ' kr' : '750 kr',
      cardStyle: 'border-radius:22px;padding:20px;min-height:170px;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;box-shadow:0 18px 40px rgba(22,22,26,.18);' + T[this.state.theme].bg
    };
  }
}
</script>
</body>
</html>
