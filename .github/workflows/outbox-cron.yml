name: Outbox cron

# D-064: inget schema här längre (Actions-kvoten tog slut). Schemat körs av
# cron-job.org var 5:e minut; den här workflown är bara för manuell körning.
# D-030: schemaläggaren för `message_outbox` är GitHub Actions, inte
# pg_cron/pg_net (WP-16). Anropar `/api/cron/outbox` var 5:e minut
# (repo-hemligheterna sätts manuellt av ägaren, aldrig av en agent).
# Bekräftelser går ändå ut inom 1 min via `kickOutbox`, oberoende av den här
# workflown — det här passet tar påminnelser (24 h, kan bli upp till ~15 min
# sena) och omförsök (backoff).

on:
  workflow_dispatch:

permissions:
  contents: read

# En körning i taget; en försenad körning köar nästa.
concurrency:
  group: outbox-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Ingen hemlighet skrivs till loggen — bara att den saknas, om så är
      # fallet. Körningen hoppas över tills CRON_SECRET/URL finns.
      - name: Anropa /api/cron/outbox
        env:
          URL: ${{ secrets.OUTBOX_CRON_URL_CL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::OUTBOX_CRON_URL_CL eller CRON_SECRET saknas, hoppar över."
            exit 0
          fi
          curl --fail --max-time 30 --silent --show-error \
            -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET"
