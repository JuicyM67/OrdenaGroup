name: Retention cron

# D-064: inget schema här längre (Actions-kvoten tog slut). Schemat körs av
# Vercel Cron (vercel.json) 09:00 UTC; den här workflown är bara för manuell körning.
# WP-26 steg 4: lagringsjobbet (F12). Samma mönster som
# `.github/workflows/outbox-cron.yml` (D-030): GitHub Actions är
# schemaläggaren, inte pg_cron/pg_net. Anropar `/api/cron/retention` en
# gång om dagen (repo-hemligheterna sätts manuellt av ägaren,
# aldrig av en agent). Routen anonymiserar kunder utan bokning på 24 mån,
# rensar gamla utkorgsrader (90 dagar) och raderar företag vars 30 dagars
# ångerfrist gått ut.

on:
  workflow_dispatch:

permissions:
  contents: read

# En körning i taget; en försenad körning köar nästa.
concurrency:
  group: retention-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Ingen hemlighet skrivs till loggen — bara att den saknas, om så är
      # fallet. Körningen hoppas över tills CRON_SECRET/URL finns.
      - name: Anropa /api/cron/retention
        env:
          URL: ${{ secrets.RETENTION_CRON_URL_CL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::RETENTION_CRON_URL_CL eller CRON_SECRET saknas, hoppar över."
            exit 0
          fi
          curl --fail --max-time 30 --silent --show-error \
            -X POST "$URL" \
            -H "Authorization: Bearer $CRON_SECRET"
