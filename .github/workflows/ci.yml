name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Samma npm som lockfilen skapades med (packageManager i package.json).
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test

      # WP-15: e2e loggar in på riktigt (magisk länk via lokal Mailpit), så
      # en lokal Supabase-stack körs i runnern. Inget moln, inga hemligheter:
      # URL och nyckel är containerns lokala standardvärden.
      - run: npx supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Exportera lokala Supabase-värden
        run: |
          npx supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}"
            echo "DATABASE_URL=$DB_URL"
            echo "NEXT_PUBLIC_APP_URL=http://127.0.0.1:3000"
          } >> "$GITHUB_ENV"

      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_DISABLE_RATE_LIMITS: "1"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      # Samma npm som lockfilen skapades med (packageManager i package.json).
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      # `npx supabase` (till skillnad från `node_modules/.bin/supabase`
      # direkt) är tillåtet i CI-filer — skyddsreglerna gäller lokala
      # agentkommandon, inte GitHub Actions-runnern. Ingen fjärrdatabas,
      # ingen `--linked`, inget moln: allt körs i en lokal container i
      # runnern.
      # WP-26: purgeBusiness testas mot riktiga Storage-API:t, så db-jobbet
      # behöver API-gatewayen + storage-api (inte bara databasen).
      - run: npx supabase start -x realtime,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Exportera lokala Supabase-värden
        run: |
          npx supabase status -o env > /tmp/sb.env
          . /tmp/sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}"
          } >> "$GITHUB_ENV"
      - run: npx supabase test db

      # WP-10: Vitest-integrationstester mot samma lokala container, bl.a.
      # F4:s samtidighetstest (två riktiga anslutningar, 23P01 → slot_taken).
      # Ingen hemlighet: det är containerns standardlösenord.
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Typdrift: den incheckade src/types/database.ts ska vara exakt vad
      # `db:types` genererar från det lokala schemat (samma kontroll som
      # görs manuellt efter varje migration).
      - run: npm run db:types
      - run: git diff --exit-code src/types/database.ts
