name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Samma npm som lockfilen skapades med (packageManager i package.json).
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Samma npm som lockfilen skapades med (packageManager i package.json).
      - run: npm install -g "$(node -p "require('./package.json').packageManager")"

      - run: npm ci

      # `npx supabase` (till skillnad från `node_modules/.bin/supabase`
      # direkt) är tillåtet i CI-filer — skyddsreglerna gäller lokala
      # agentkommandon, inte GitHub Actions-runnern. Ingen fjärrdatabas,
      # ingen `--linked`, inget moln: allt körs i en lokal container i
      # runnern.
      - run: npx supabase db start
      - run: npx supabase test db

      # WP-10: Vitest-integrationstester mot samma lokala container, bl.a.
      # F4:s samtidighetstest (två riktiga anslutningar, 23P01 → slot_taken).
      # Ingen hemlighet: det är containerns standardlösenord.
      - run: npm run test:integration
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      # Typdrift: den incheckade src/types/database.ts ska vara exakt vad
      # `db:types` genererar från det lokala schemat (samma kontroll som
      # görs manuellt efter varje migration).
      - run: npm run db:types
      - run: git diff --exit-code src/types/database.ts
